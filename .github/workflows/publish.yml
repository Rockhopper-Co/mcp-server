name: Publish to npm

# ENG-2755 — PUBLISH ONLY. This pipeline never moves a dist-tag.
#
# `npm publish --tag <x>` sets the dist-tag as part of the publish, and that is
# the ONLY registry write this workflow makes. There is deliberately no
# `npm dist-tag add` anywhere: Trusted Publishing (OIDC) mints a publish-only
# credential and answers E401 to a dist-tag write (measured 2026-08-19, run
# 32227933905), and a granular npm token answers EOTP — requires a one-time
# password (run 32233011522) because npm restricted 2FA-bypass granular tokens
# in early August 2026. Those tokens also lose direct publishing around January
# 2027, and npm's stated replacement is Trusted Publishing. So promotion is not
# blocked pending a credential; it is unreachable, now and later.
#
# Two channels, each a plain publish of a DIFFERENT version:
#   push to `staging` → publish `<pkg version>-staging.<short sha>` --tag staging
#   push tag v*.*.*   → publish `<pkg version>`                     (--tag latest)
# The staging build is a prerelease, so the released version is still unpublished
# when the tag fires and can simply be published to `latest`.

on:
  push:
    tags:
      - 'v*.*.*'
    # Pre-main staging QA of the package is REQUIRED. A push to `staging`
    # publishes a prerelease under the `staging` dist-tag — never `latest` — so
    # the staging gateway can install `@rockhopper-co/mcp-server@staging` and
    # serve unreleased tools for QA.
    branches:
      - staging
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run (no publish)'
        type: boolean
        default: false

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    name: Build, test, and publish
    runs-on: ubuntu-latest
    environment: npm-publish
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          registry-url: https://registry.npmjs.org/
          cache: npm

      # Trusted Publishing (OIDC) requires npm CLI >= 11.5.1.
      # Node 20 ships with npm 10.x, so upgrade explicitly.
      #
      # PINNED TO 11.x ON PURPOSE — do not restore `npm@latest`. npm 12 requires
      # node "^22.22.2 || ^24.15.0 || >=26.0.0"; .nvmrc pins 20 (resolves to
      # v20.20.2), so `npm@latest` fails EBADENGINE and takes the whole publish
      # with it. That is what silently blocked the 0.9.0 release. npm 11 requires
      # "^20.17.0 || >=22.9.0", which v20.20.2 satisfies, and 11.5.1+ has the
      # Trusted Publishing support this job needs. Raising .nvmrc past 22.9 is
      # the prerequisite for ever widening this pin.
      - name: Upgrade npm CLI for Trusted Publishing
        run: npm install -g npm@^11.5.1

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      # TODO(mcp): wire eslint in a follow-up PR; skipping for GA.
      # - name: Lint
      #   run: npm run lint

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Verify bin is executable
        run: |
          test -f dist/cli.js
          head -n1 dist/cli.js | grep -q '^#!/usr/bin/env node'
          chmod +x dist/cli.js

      - name: Verify package version matches tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          PKG_VERSION=$(node -p "require('./package.json').version")
          if [ "$TAG_VERSION" != "$PKG_VERSION" ]; then
            echo "Tag version ($TAG_VERSION) does not match package.json version ($PKG_VERSION)"
            exit 1
          fi

      # Decide WHAT VERSION to publish and under WHICH dist-tag, from the ref.
      # A tag publishes the committed version to the default tag `latest`.
      # Anything else — a `staging` push, or a manual dispatch used to rehearse
      # one — publishes a prerelease derived from the committed version, under
      # `staging`. A dispatch on any branch therefore exercises exactly the
      # staging path rather than a special case of its own, and no non-tag ref
      # can reach `latest`.
      - name: Resolve version and dist-tag
        id: target
        run: |
          set -euo pipefail
          PKG_NAME=$(node -p "require('./package.json').name")
          PKG_VERSION=$(node -p "require('./package.json').version")
          case "$GITHUB_REF" in
            refs/tags/v*)
              VERSION="$PKG_VERSION"
              DIST_TAG=latest
              ;;
            *)
              SHORT_SHA="${GITHUB_SHA:0:7}"
              # A prerelease identifier that is all digits with a leading zero
              # is not valid semver, and a 7-char hex sha is that ~0.4% of the
              # time. Prefix those, git-describe style, rather than fail a
              # release on a coin flip.
              case "$SHORT_SHA" in
                0[0-9][0-9][0-9][0-9][0-9][0-9]) SHORT_SHA="g$SHORT_SHA" ;;
              esac
              VERSION="${PKG_VERSION}-staging.${SHORT_SHA}"
              DIST_TAG=staging
              ;;
          esac
          if npm view "$PKG_NAME@$VERSION" version >/dev/null 2>&1; then
            EXISTS=true
          else
            EXISTS=false
          fi
          echo "name=$PKG_NAME"     >> "$GITHUB_OUTPUT"
          echo "version=$VERSION"   >> "$GITHUB_OUTPUT"
          echo "dist_tag=$DIST_TAG" >> "$GITHUB_OUTPUT"
          echo "exists=$EXISTS"     >> "$GITHUB_OUTPUT"
          echo "Publishing $PKG_NAME@$VERSION under dist-tag '$DIST_TAG' (already on registry: $EXISTS)."

      # Never committed — the checkout is thrown away with the runner. npm reads
      # the version from package.json at publish time, and the package reads it
      # back at runtime for its own version banner, so this is the whole of what
      # makes the published artifact a prerelease.
      - name: Stamp the derived prerelease version
        if: ${{ steps.target.outputs.dist_tag == 'staging' }}
        run: |
          set -euo pipefail
          npm version --no-git-tag-version --allow-same-version "${{ steps.target.outputs.version }}"
          echo "package.json version is now $(node -p "require('./package.json').version")"

      - name: Publish dry-run
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
        run: npm publish --dry-run --access public --tag "${{ steps.target.outputs.dist_tag }}"

      # Trusted Publishing: no NPM_TOKEN. npm CLI exchanges the GitHub OIDC
      # token for a short-lived registry credential automatically, and
      # provenance is implied (cannot be disabled). See:
      # https://docs.npmjs.com/trusted-publishers
      - name: Publish to npm (Trusted Publishing + provenance)
        if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.dry_run) && steps.target.outputs.exists == 'false' }}
        run: npm publish --access public --tag "${{ steps.target.outputs.dist_tag }}"

      # The registry already holds this exact version, so there is nothing to
      # publish and nothing to move. On `staging` that means the same commit was
      # re-run; on `latest` it means the tag's publish already succeeded.
      - name: Nothing to publish
        if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.dry_run) && steps.target.outputs.exists == 'true' }}
        run: |
          echo "${{ steps.target.outputs.name }}@${{ steps.target.outputs.version }} is already on the registry — no-op. A published version is never re-published, and this pipeline never moves a dist-tag."
