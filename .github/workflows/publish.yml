name: Publish to npm

on:
  push:
    tags:
      - 'v*.*.*'
    # ENG-2748 (David, 2026-08-19): pre-main staging QA of the package is
    # REQUIRED. A push to `staging` publishes package.json's version under the
    # `staging` dist-tag — never `latest` — so the staging gateway can install
    # `@rockhopper-co/mcp-server@staging` and serve unreleased tools for QA.
    branches:
      - staging
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run (no publish)'
        type: boolean
        default: false

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    name: Build, test, and publish
    runs-on: ubuntu-latest
    environment: npm-publish
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          registry-url: https://registry.npmjs.org/
          cache: npm

      # Trusted Publishing (OIDC) requires npm CLI >= 11.5.1.
      # Node 20 ships with npm 10.x, so upgrade explicitly.
      #
      # PINNED TO 11.x ON PURPOSE — do not restore `npm@latest`. npm 12 requires
      # node "^22.22.2 || ^24.15.0 || >=26.0.0"; .nvmrc pins 20 (resolves to
      # v20.20.2), so `npm@latest` fails EBADENGINE and takes the whole publish
      # with it. That is what silently blocked the 0.9.0 release. npm 11 requires
      # "^20.17.0 || >=22.9.0", which v20.20.2 satisfies, and 11.5.1+ has the
      # Trusted Publishing support this job needs. Raising .nvmrc past 22.9 is
      # the prerequisite for ever widening this pin.
      - name: Upgrade npm CLI for Trusted Publishing
        run: npm install -g npm@^11.5.1

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      # TODO(mcp): wire eslint in a follow-up PR; skipping for GA.
      # - name: Lint
      #   run: npm run lint

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Verify bin is executable
        run: |
          test -f dist/cli.js
          head -n1 dist/cli.js | grep -q '^#!/usr/bin/env node'
          chmod +x dist/cli.js

      - name: Verify package version matches tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          PKG_VERSION=$(node -p "require('./package.json').version")
          if [ "$TAG_VERSION" != "$PKG_VERSION" ]; then
            echo "Tag version ($TAG_VERSION) does not match package.json version ($PKG_VERSION)"
            exit 1
          fi

      # ENG-2748 — decide the CHANNEL from the ref, and whether there is
      # anything to publish at all. Two channels, one rule each:
      #   tag v*.*.*   → `latest`  (production release; the existing path)
      #   staging push → `staging` (pre-main QA; never touches `latest`)
      # A version already on the registry is not re-published (npm refuses
      # anyway); on the `latest` channel it is PROMOTED via dist-tag instead,
      # which is the normal case once staging published it first. On the
      # `staging` channel an existing version is a no-op unless it lacks the
      # tag, in which case only the tag moves.
      - name: Resolve publish channel
        id: channel
        run: |
          PKG_NAME=$(node -p "require('./package.json').name")
          PKG_VERSION=$(node -p "require('./package.json').version")
          case "$GITHUB_REF" in
            refs/tags/v*)         CHANNEL=latest ;;
            refs/heads/staging)   CHANNEL=staging ;;
            *)
              if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
                # Dispatch on a branch other than staging → treat as staging
                # for a dry-run only; a real dispatch publish must come from a
                # tag (latest) or from staging.
                CHANNEL=staging
              else
                echo "Unsupported ref $GITHUB_REF" >&2; exit 1
              fi ;;
          esac
          if npm view "$PKG_NAME@$PKG_VERSION" version >/dev/null 2>&1; then
            EXISTS=true
          else
            EXISTS=false
          fi
          CURRENT_TAG_VERSION=$(npm view "$PKG_NAME" "dist-tags.$CHANNEL" 2>/dev/null || true)
          echo "channel=$CHANNEL"          >> "$GITHUB_OUTPUT"
          echo "exists=$EXISTS"            >> "$GITHUB_OUTPUT"
          echo "version=$PKG_VERSION"      >> "$GITHUB_OUTPUT"
          echo "name=$PKG_NAME"            >> "$GITHUB_OUTPUT"
          echo "tag_at=$CURRENT_TAG_VERSION" >> "$GITHUB_OUTPUT"
          echo "channel=$CHANNEL version=$PKG_VERSION exists=$EXISTS ${CHANNEL}→${CURRENT_TAG_VERSION:-<unset>}"

      - name: Publish dry-run
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
        run: npm publish --dry-run --access public --tag "${{ steps.channel.outputs.channel }}"

      # Trusted Publishing: no NPM_TOKEN. npm CLI exchanges the GitHub OIDC
      # token for a short-lived registry credential automatically, and
      # provenance is implied (cannot be disabled). See:
      # https://docs.npmjs.com/trusted-publishers
      - name: Publish to npm (Trusted Publishing + provenance)
        if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.dry_run) && steps.channel.outputs.exists == 'false' }}
        run: npm publish --access public --tag "${{ steps.channel.outputs.channel }}"

      # The version is already on the registry (staging published it first, or
      # a re-run). Do not re-publish; move the channel's dist-tag to it if it is
      # not already there. On `latest` this IS the production release.
      #
      # MEASURED 2026-08-19 (run 32227933905): Trusted Publishing's OIDC
      # exchange mints a credential for `npm publish` ONLY — `npm dist-tag add`
      # answers E401 under it. Promotion therefore needs a real token: the
      # `npm-publish` environment secret NPM_TOKEN (granular, publish-only,
      # scoped to this package). Absent, fail LOUDLY with the reason instead of
      # printing an auth error nobody can act on.
      - name: Promote existing version to channel dist-tag
        if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.dry_run) && steps.channel.outputs.exists == 'true' && steps.channel.outputs.tag_at != steps.channel.outputs.version }}
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -z "$NODE_AUTH_TOKEN" ]; then
            echo "::error::Promotion of ${{ steps.channel.outputs.name }}@${{ steps.channel.outputs.version }} to dist-tag '${{ steps.channel.outputs.channel }}' needs the npm-publish environment secret NPM_TOKEN (granular publish token for this package). Trusted Publishing cannot run 'npm dist-tag add'. Add the secret and re-run this workflow." 
            exit 1
          fi
          npm dist-tag add "${{ steps.channel.outputs.name }}@${{ steps.channel.outputs.version }}" "${{ steps.channel.outputs.channel }}"

      - name: Nothing to do
        if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.dry_run) && steps.channel.outputs.exists == 'true' && steps.channel.outputs.tag_at == steps.channel.outputs.version }}
        run: echo "${{ steps.channel.outputs.name }}@${{ steps.channel.outputs.version }} already carries dist-tag ${{ steps.channel.outputs.channel }} — no-op."
