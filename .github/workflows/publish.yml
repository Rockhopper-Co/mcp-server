name: Publish to npm

# ENG-2807 — THE TRIGGER IS A MERGE. There is no hand-cut release tag.
#
# `frontend/.github/workflows/publish-packages.yml` predicted this repo's defect
# in writing and named this repo while doing it: under a tag-driven publish
# "someone has to remember to cut the tag, nothing watches whether they did."
# On 2026-08-19 that is exactly what happened — 2.1.1 reached the registry, no
# `v2.1.1` tag was ever cut, `latest` stayed on 2.1.0, and every customer
# install received the older version. Nothing noticed. So the tag path is gone.
# A merge publishes; no human has to remember anything.
#
# WHY `main` AND NOT `dev`, unlike frontend. Frontend's packages are private
# (GitHub Packages) and consumed only by the add-in, so publishing `dev`
# straight to `latest` is safe there. `@rockhopper-co/mcp-server` is PUBLIC and
# installed by customers — Cursor, Claude Desktop, anyone running the local
# server — so `latest` is bound to the branch that already means reviewed and
# released. The PRINCIPLE is frontend's; the branch deliberately is not.
#
# ENG-2755 — PUBLISH ONLY. This pipeline never moves a dist-tag.
#
# `npm publish --tag <x>` sets the dist-tag as part of the publish, and that is
# the ONLY registry write this workflow makes. There is deliberately no
# `npm dist-tag add` anywhere: Trusted Publishing (OIDC) mints a publish-only
# credential and answers E401 to a dist-tag write (measured 2026-08-19, run
# 32227933905), and a granular npm token answers EOTP — requires a one-time
# password (run 32233011522) because npm restricted 2FA-bypass granular tokens
# in early August 2026. Those tokens also lose direct publishing around January
# 2027, and npm's stated replacement is Trusted Publishing. So promotion is not
# blocked pending a credential; it is unreachable, now and later.
#
# Two channels, each a plain publish of a DIFFERENT version:
#   push to `main`    → publish `<major>.<minor>.<run number>`                --tag latest
#   push to `staging` → publish `<major>.<minor>.<run number>-staging.<sha>`  --tag staging
#
# THE VERSION IS DERIVED, NEVER COMMITTED, and that is what makes a collision
# impossible rather than unlikely. `github.run_number` is monotonic per workflow
# and is never handed to two different runs, so two runs cannot compute the same
# version while major.minor is unchanged; and raising major.minor raises the
# version regardless of the run number, so the sequence is strictly increasing
# across bumps too. Humans own major.minor in package.json; the machine owns the
# patch. package.json's patch digit is decorative from here on, and nothing in
# git is edited to cut a release.
#
# The ONE case where a run number repeats is re-running the SAME run
# (`run_attempt` increments, `run_number` does not). A re-run of a publish that
# already succeeded therefore collides on purpose, and is refused loudly by
# "Refuse a version the registry already holds" below. A re-run of a publish
# that failed BEFORE the publish step recomputes the same unpublished version
# and succeeds, which is the behaviour that makes a re-run useful.
#
# Ordering across the two channels is coherent because both derive from the same
# counter: `2.1.30-staging.abc1234` sorts above `2.1.29` on `latest` and below
# the next `latest` publish, so `staging` is always ahead of `latest` and never
# behind it.

on:
  # Merges only. No `tags:` filter, and no `dev` trigger — CI runs on prod
  # elevations only (David, 2026-07-31, Actions budget), and a `dev` publish
  # would double the run count while the `staging` merge that follows it is
  # what the gateway actually installs.
  push:
    branches:
      - main
      - staging
  # Escape hatch for a publish that failed downstream of the registry. The
  # channel follows the ref it is dispatched from, exactly as a push would:
  # from `main` it republishes `latest` under a fresh run number, from anywhere
  # else it publishes a `staging` prerelease. No dispatch can reach `latest`
  # from a branch other than `main`.
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run (no publish)'
        type: boolean
        default: false

permissions:
  contents: read
  id-token: write

# Two pushes to the same branch in quick succession would race on the dist-tag:
# the versions cannot collide, but `--tag` points wherever the LAST publish
# lands, which could be the older commit. Serialise per ref; never cancel, since
# a cancelled run is a version that silently never shipped.
concurrency:
  group: publish-npm-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: Build, test, and publish
    runs-on: ubuntu-latest
    # Named in npm's trusted-publisher configuration alongside this file's path.
    # Renaming either the environment or this workflow file breaks OIDC. It
    # carries no protection rules (measured 2026-08-19: `protection_rules: []`,
    # `deployment_branch_policy: null`), so it gates nothing and adds no human
    # step — it is an OIDC subject claim, not an approval.
    environment: npm-publish
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          registry-url: https://registry.npmjs.org/
          cache: npm

      # Trusted Publishing (OIDC) requires npm CLI >= 11.5.1.
      # Node 20 ships with npm 10.x, so upgrade explicitly.
      #
      # PINNED TO 11.x ON PURPOSE — do not restore `npm@latest`. npm 12 requires
      # node "^22.22.2 || ^24.15.0 || >=26.0.0"; .nvmrc pins 20 (resolves to
      # v20.20.2), so `npm@latest` fails EBADENGINE and takes the whole publish
      # with it. That is what silently blocked the 0.9.0 release. npm 11 requires
      # "^20.17.0 || >=22.9.0", which v20.20.2 satisfies, and 11.5.1+ has the
      # Trusted Publishing support this job needs. Raising .nvmrc past 22.9 is
      # the prerequisite for ever widening this pin.
      - name: Upgrade npm CLI for Trusted Publishing
        run: npm install -g npm@^11.5.1

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      # TODO(mcp): wire eslint in a follow-up PR; skipping for GA.
      # - name: Lint
      #   run: npm run lint

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Verify bin is executable
        run: |
          test -f dist/cli.js
          head -n1 dist/cli.js | grep -q '^#!/usr/bin/env node'
          chmod +x dist/cli.js

      # Decide WHAT VERSION to publish and under WHICH dist-tag, from the branch.
      # `main` is the only ref that can reach `latest`; everything else is a
      # `staging` prerelease. See the header for why the run number is the patch.
      - name: Resolve version and dist-tag
        id: target
        run: |
          set -euo pipefail
          PKG_NAME=$(node -p "require('./package.json').name")
          PKG_VERSION=$(node -p "require('./package.json').version")
          # major.minor only — the committed patch is ignored on purpose.
          BASE=$(printf '%s' "$PKG_VERSION" | cut -d. -f1,2)
          case "$BASE" in
            [0-9]*.[0-9]*) ;;
            *)
              echo "::error::package.json version '$PKG_VERSION' does not start with <major>.<minor>. Refusing to derive a publish version from it."
              exit 1
              ;;
          esac
          case "$GITHUB_REF" in
            refs/heads/main)
              VERSION="${BASE}.${GITHUB_RUN_NUMBER}"
              DIST_TAG=latest
              ;;
            *)
              SHORT_SHA="${GITHUB_SHA:0:7}"
              # A prerelease identifier that is all digits with a leading zero
              # is not valid semver, and a 7-char hex sha is that ~0.4% of the
              # time. Prefix those, git-describe style, rather than fail a
              # release on a coin flip.
              case "$SHORT_SHA" in
                0[0-9][0-9][0-9][0-9][0-9][0-9]) SHORT_SHA="g$SHORT_SHA" ;;
              esac
              VERSION="${BASE}.${GITHUB_RUN_NUMBER}-staging.${SHORT_SHA}"
              DIST_TAG=staging
              ;;
          esac
          echo "name=$PKG_NAME"     >> "$GITHUB_OUTPUT"
          echo "version=$VERSION"   >> "$GITHUB_OUTPUT"
          echo "dist_tag=$DIST_TAG" >> "$GITHUB_OUTPUT"
          echo "Publishing $PKG_NAME@$VERSION under dist-tag '$DIST_TAG'."

      # ENG-2807's OWN FAILURE MODE, killed. The step this replaces printed
      # "Nothing to publish" and exited GREEN when the registry already held the
      # version — a stage succeeding while achieving nothing, which is precisely
      # how `latest` sat on 2.1.0 with 2.1.1 published and nobody noticed.
      #
      # This can only fire on a re-run of an already-successful run, or after a
      # hand-edit of major.minor that walks backwards into a published version.
      # Both are wrong and both now go red.
      #
      # `npm view` failing for any other reason (network, registry outage)
      # leaves FOUND empty and lets the run continue — the publish below is then
      # the backstop, because npm answers EPUBLISHCONFLICT to a republish and
      # cannot silently overwrite. Two independent refusals, and this one exists
      # to name the problem before 4 minutes of build time are spent.
      - name: Refuse a version the registry already holds
        env:
          NAME: ${{ steps.target.outputs.name }}
          VERSION: ${{ steps.target.outputs.version }}
        run: |
          set -euo pipefail
          FOUND=$(npm view "$NAME@$VERSION" version 2>/dev/null || true)
          if [ -n "$FOUND" ]; then
            echo "::error::$NAME@$VERSION is already on the registry. A published version is never re-published and this pipeline never moves a dist-tag, so there is nothing this run can do. Re-running a publish that already succeeded cannot help — read the run that published it."
            exit 1
          fi
          echo "$NAME@$VERSION is not on the registry."

      # Since npm 11.0.0 (npm/cli#7939) the CLI refuses a publish outright
      # rather than moving `latest` backwards, and the pin above is npm 11. That
      # refusal names neither version, so this step makes the same call first
      # and says which two versions are involved. Cannot fire under the derived
      # scheme unless major.minor is hand-lowered in package.json.
      - name: Refuse to move `latest` backwards
        if: ${{ steps.target.outputs.dist_tag == 'latest' }}
        env:
          NAME: ${{ steps.target.outputs.name }}
          VERSION: ${{ steps.target.outputs.version }}
        run: |
          set -euo pipefail
          CURRENT=$(npm view "$NAME" dist-tags.latest 2>/dev/null || true)
          if [ -z "$CURRENT" ]; then
            echo "No current 'latest' dist-tag to compare against — first publish."
            exit 0
          fi
          node -e '
            const cmp = (x, y) => {
              const a = x.split(".").map(Number), b = y.split(".").map(Number);
              for (let i = 0; i < 3; i++) { if (a[i] !== b[i]) return a[i] - b[i]; }
              return 0;
            };
            const [next, current] = process.argv.slice(1);
            if (cmp(next, current) <= 0) {
              console.error(`::error::Refusing to publish ${next} to latest — latest is already ${current}. npm 11 rejects a backwards latest anyway; raise major.minor in package.json.`);
              process.exit(1);
            }
            console.log(`${next} > ${current}, latest moves forward.`);
          ' "$VERSION" "$CURRENT"

      # Never committed — the checkout is thrown away with the runner. npm reads
      # the version from package.json at publish time, and the package reads it
      # back at runtime for its own version banner, so this is the whole of what
      # makes the published artifact carry the derived version.
      - name: Stamp the derived version
        run: |
          set -euo pipefail
          npm version --no-git-tag-version --allow-same-version "${{ steps.target.outputs.version }}"
          echo "package.json version is now $(node -p "require('./package.json').version")"

      - name: Publish dry-run
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
        run: npm publish --dry-run --access public --tag "${{ steps.target.outputs.dist_tag }}"

      # Trusted Publishing: no NPM_TOKEN. npm CLI exchanges the GitHub OIDC
      # token for a short-lived registry credential automatically, and
      # provenance is implied (cannot be disabled). Provenance is also what
      # replaces the retired git tag as the link from a published version back
      # to its commit. See: https://docs.npmjs.com/trusted-publishers
      - name: Publish to npm (Trusted Publishing + provenance)
        if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.dry_run) }}
        run: npm publish --access public --tag "${{ steps.target.outputs.dist_tag }}"
