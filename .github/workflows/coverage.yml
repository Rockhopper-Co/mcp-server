name: Coverage

on:
  # Runs on dev-base AND main-base pull requests (ENG-2857). David, 2026-08-20:
  # "we can expand the actions budget. this just needs to work smoothly."
  #
  # SUPERSEDES the 2026-07-31 "PROD ELEVATIONS ONLY" trigger, which read
  # `branches: [main]` and meant a feature pull request into `dev` created no
  # run at all. That trade — a defect surfaces at the prod elevation instead of
  # at the feature PR — was paid three times on the night of 2026-08-19/20, each
  # time with a human waiting to ship. Cost is no longer the binding constraint.
  #
  # Still gated at the TRIGGER and not per-job: a job-level `if:` still creates
  # the run and posts skipped checks, which is what the 2026-07-31 decision was
  # avoiding, and that reasoning is unchanged.
  #
  # `staging` is deliberately absent. dev -> staging elevations are opened and
  # merged in 12-30s (measured: backend #1315 19s, #1317 12s, #1312 18s), so a
  # run keyed there is cancelled by the next merge before it can report — the
  # same reason backend's e2e gate was moved off dev in the first place.
  pull_request:
    branches: [dev, main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  coverage-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: "npm"
      - run: npm ci
      - name: Validate coverage thresholds are configured
        run: |
          node -e "const fs=require('fs');const s=fs.readFileSync('vitest.config.ts','utf8');const mins={statements:95,branches:70,functions:90,lines:95};for(const [k,min] of Object.entries(mins)){const m=s.match(new RegExp(k+'\\\\s*:\\\\s*(\\\\d+)'));if(!m||Number(m[1])<min){throw new Error('coverage threshold for '+k+' is below '+min)}}"
      - name: Run full test suite with coverage (unit + in-process e2e + stdio e2e subprocess)
        run: npm run test:cov
