name: Coverage

on:
  # ENG-3139 — the coverage gate runs where a pull request SITS AND SOMEONE WAITS, and
  # never where it is merged on sight. David approved this topology 2026-08-23.
  # It supersedes the 2026-08-22 "PROD ELEVATIONS ONLY" revert whose comment
  # stood here, and the 2026-07-31 CI-budget rule behind that.
  #
  # Measured per 60 merged pull requests: `feature -> dev` (21-37) and
  # `feature -> epic/**` (18-33) are merged on sight with nobody waiting, so
  # they are NOT gated. `epic/** -> dev` (~1 per epic, open for days),
  # `dev -> staging` (6-25, and manual QA follows it) and `staging -> main`
  # (1-3) all sit open with someone waiting, so all three ARE gated. The
  # staging gate is the one this round existed to add: what sits behind it is
  # manual QA time.
  #
  # The trigger names all three bases; the job-level `if:` below sorts out the
  # `dev` one — a dev-base pull request runs only when its head is an `epic/**`
  # branch. Every other dev-base pull request posts a SKIPPED check and spends
  # zero runner minutes. David accepted that visible skip in place of a manual
  # dispatch; a job-level `if:` still CREATES the run and nothing avoids that.
  #
  # `workflow_dispatch` stays and is load-bearing: it runs the full suite with coverage on demand
  # against any branch, including a feature branch no gate sees.
  #
  # ENG-3437 — the standing elevation pull requests stop re-testing on every
  # push. David approved this 2026-08-26. `auto-elevation-pr.yml` keeps a
  # `dev` -> `staging` and a `staging` -> `main` pull request open the whole
  # time, so with the DEFAULT event types every push to `dev` or `staging`
  # re-fired this workflow on one of them as a `synchronize`. That is the
  # `push: branches: [dev]` trigger the topology above deliberately bans,
  # wearing a `pull_request` event.
  #
  # Measured org-wide over 14 days, 2026-08-12..2026-08-26 (4,800 runs, 8
  # repositories): 13,431 of 23,128 minutes — 58% — came from runs whose head
  # branch was `dev` or `staging`, i.e. from those two standing pull requests.
  # And a red gate never stops re-running: backend's suite failed 67 times on
  # head=`staging` for 4,337 minutes, every repeat after the first buying zero
  # information.
  #
  # `types:` IS NOT ADDITIVE — naming it REPLACES the default
  # [opened, synchronize, reopened], so all three are re-listed below.
  # `ready_for_review` is the addition: the `staging` -> `main` elevation now
  # opens as a draft, and a human marking it ready is the QA signal that fires
  # this suite. The waiter appears at QA time instead of at every merge to
  # `dev`.
  #
  # The job-level `if:` below carries the other two halves, and each is a trap
  # that kills the gate silently if it is dropped:
  #   - a DRAFT pull request still emits `opened`, so without the
  #     `draft == false` leg the draft production elevation would run this
  #     whole suite the moment it opens — against the release's first commit,
  #     which is worse than not running it at all;
  #   - `workflow_dispatch` has NO `github.event.pull_request`, so a bare
  #     `github.event.pull_request.draft == false` evaluates FALSE and would
  #     silently kill the dispatch escape hatch this header calls load-bearing.
  #     The `github.event_name != 'pull_request' ||` leg is what protects it.
  #
  # A feature or hotfix pull request into `staging` or `main` is UNCHANGED:
  # `synchronize` still re-tests it on every push. Only a head of `dev` or
  # `staging` — which is only ever an elevation — stops re-running.
  # ENG-3502 — THE `synchronize` LEG BELOW IS UNCHANGED AND STAYS CORRECT. What
  # was broken is upstream of it: a standing `dev` -> `staging` elevation only
  # ever received `synchronize` events, so this gate never re-fired on anything
  # merged after the pull request opened, and gate 3 tested whatever `dev` held
  # at open time. Measured on frontend #1658 — 29 commits reached `staging` with
  # every substantive check SKIPPED.
  #
  # David ruled 2026-08-27, "option A plus the full suite":
  # `auto-elevation-pr.yml` now CLOSES AND REOPENS that one pull request when a
  # push lands on `dev` while it is open. A reopen emits `reopened`, which is in
  # the `types:` list below and is not a `synchronize`, so this gate fires on
  # the branch's real tip without touching the ENG-3437 leg — which still
  # protects `staging` -> `main` and every feature pull request into `staging`
  # or `main`. Rejected: exempting the pair from the leg (B — re-runs on every
  # intermediate merge into `dev`), a debounce (C — machinery, and nobody waits
  # on a timer), accepting the hole with a note (D — makes manual QA the
  # detector, which is what ENG-3139 set out to stop).
  #
  pull_request:
    types: [opened, reopened, ready_for_review, synchronize]
    branches: [dev, staging, main]
  workflow_dispatch:

# ENG-3439 — keyed on the pull request NUMBER, never on the head branch. The
# key here was `github.head_ref || github.ref`, and EVERY `dev` -> `staging`
# elevation has head_ref = `dev`: all ~100 of them in the 14 days to 2026-08-26
# shared one concurrency group, so opening a new elevation cancelled the
# previous one's in-flight run. Two different pull requests were
# indistinguishable from one pull request re-triggering. Keyed on the number, a
# run collides only with its own re-triggers, which is what cancellation is
# for. A `push` or `workflow_dispatch` run has no pull request and falls
# through to `github.ref` — today's behaviour, unchanged.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  coverage-gate:
    # ENG-3139 — a dev-base pull request runs only when its head is an epic
    # branch; `feature -> dev` is merged on sight and nobody waits on it.
    # `staging` and `main` bases always run. See the trigger header.
    #
    # ENG-3437 adds the two legs around it, and the ORDER of the three is not
    # meaningful but the presence of each is. Leg 1 never runs on a draft —
    # the `staging` -> `main` elevation now opens as one, and its
    # `github.event_name != 'pull_request'` guard is what keeps
    # `workflow_dispatch` working, where `github.event.pull_request` does not
    # exist. Leg 3 never runs on a `synchronize` whose head is `dev` or
    # `staging`: that is a push into a standing elevation, which is where 58%
    # of this org's Actions minutes went in the 14 days to 2026-08-26.
    if: >-
      (github.event_name != 'pull_request' || github.event.pull_request.draft == false)
      && (github.base_ref != 'dev' || startsWith(github.head_ref, 'epic/'))
      && (github.event.action != 'synchronize'
          || !contains(fromJSON('["dev","staging"]'), github.head_ref))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: "npm"
      - run: npm ci
      - name: Validate coverage thresholds are configured
        run: |
          node -e "const fs=require('fs');const s=fs.readFileSync('vitest.config.ts','utf8');const mins={statements:95,branches:70,functions:90,lines:95};for(const [k,min] of Object.entries(mins)){const m=s.match(new RegExp(k+'\\\\s*:\\\\s*(\\\\d+)'));if(!m||Number(m[1])<min){throw new Error('coverage threshold for '+k+' is below '+min)}}"
      - name: Run full test suite with coverage (unit + in-process e2e + stdio e2e subprocess)
        run: npm run test:cov
