name: Coverage

on:
  # PROD ELEVATIONS ONLY — `main`-base pull requests. REVERTS ENG-2857, which
  # had added `dev` here. David, 2026-08-22: "that is incredibly expensive, and
  # pointless, because i will purposefully NEVER let them finish." A `dev`-base
  # pull request is a formality he clears immediately, so a check nobody waits
  # on gates nothing and the run is wasted either way.
  #
  # `workflow_dispatch` is what replaces it — it runs this check on demand
  # against any branch, which is why it stays.
  #
  # Still gated at the TRIGGER and not per-job: a job-level `if:` still creates
  # the run and posts skipped checks.
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  coverage-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: "npm"
      - run: npm ci
      - name: Validate coverage thresholds are configured
        run: |
          node -e "const fs=require('fs');const s=fs.readFileSync('vitest.config.ts','utf8');const mins={statements:95,branches:70,functions:90,lines:95};for(const [k,min] of Object.entries(mins)){const m=s.match(new RegExp(k+'\\\\s*:\\\\s*(\\\\d+)'));if(!m||Number(m[1])<min){throw new Error('coverage threshold for '+k+' is below '+min)}}"
      - name: Run full test suite with coverage (unit + in-process e2e + stdio e2e subprocess)
        run: npm run test:cov
