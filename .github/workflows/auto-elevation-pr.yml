name: auto-elevation-pr

# Open the "elevate to <branch>" pull request whenever a promotion branch has
# fallen behind.  ENG-3180.
#
# David, 2026-08-23: "can we add controls to github to always automatically open
# an 'elevate to <branch>' pr whenever there is a disparity? for the prod one, it
# should request a review from sperezl1".
#
# EVERY DECISION LIVES IN `scripts/auto-elevation-pr.sh`, NOT HERE.  A workflow
# that inlines its logic in `run:` blocks can only be tested in production.
# `scripts/auto-elevation-pr.test.sh` drives that script against a real git
# repository with `gh` stubbed on PATH, and the `verify` job below runs it
# BEFORE the `elevate` job is allowed to touch GitHub.  A broken decision table
# cannot open a pull request.
#
# THE CASE COUNT IS DELIBERATELY NOT WRITTEN HERE.  ENG-4065: this line read
# "15 cases, including four attacks" while the suite ran 28 and 10, and every one
# of the nine repositories carrying this workflow was wrong on 2026-09-01 —
# including the one whose numbers had just been hand-corrected, still off by one.
# A count re-typed into a comment goes stale silently, and it reads as authority
# in the one place a reader checks to decide how much to trust the gate.  The
# suite prints its own tally on every run — `N checks passed, M of them attacks`,
# counted from the assertions that actually fired — so read the `verify` job's
# log instead of trusting a number here.
#
# WHAT THIS NEVER DOES: merge an elevation, mark one ready, or change the draft
# state of one that is already open.  An open elevation is the release sitting
# in its normal state, not a task anyone is late on.
#
# ENG-3502 — IT DOES NOW CLOSE AND REOPEN THE `dev` -> `staging` ELEVATION, and
# only that one, when a push lands on `dev` while it is open.  David ruled this
# on 2026-08-27: "option A plus the full suite."  The decision table lives in
# `scripts/auto-elevation-pr.sh` section 2a with the reasoning and the three
# rejected options; cases 19-24 of the test file assert it in both directions.
#
# THE DEFECT IT FIXES.  The gate workflows refuse to re-run on a `synchronize`
# whose head is `dev` or `staging` (ENG-3437, correct in isolation), and this
# workflow opens an elevation once and then never touches it — so every merge
# into `dev` after that arrived as a `synchronize` and was never gated.  Gate 3
# could only ever fire against whatever `dev` held at open time.  Measured on
# frontend #1658: 29 commits reached `staging` with every substantive check
# SKIPPED.  A close followed by a reopen emits `reopened`, which is in all three
# `types:` lists and is not a `synchronize`, so the gate fires on the real
# content with the ENG-3437 leg untouched.
#
# The pull request keeps its number, its branches, its draft state and its
# review history.  The close is how the event is emitted, never a disposition.
#
# That line read "mark one ready or draft" until 2026-08-26.  ENG-3437 makes the
# `staging` -> `main` leg open its pull request AS a draft — `scripts/`
# `auto-elevation-pr.sh` section 4 — so the suites do not start until a human
# marks it ready.  Marking it ready is still never automation's move: that click
# IS the QA signal, and it is the only thing that fires gate 4.
#
# THIS DOES NOT DISTURB THE GATE TOPOLOGY (ENG-3139).  It adds no trigger to any
# test workflow and changes no `pull_request` base list.  It creates the pull
# request that gates 3 and 4 already fire on — `dev` -> `staging` and
# `staging` -> `main` are exactly the two hops where a human waits on the suite,
# which is why an auto-opened elevation carrying NO checks would be worse than a
# late hand-opened one.  See the credential note below.
#
# ENG-3437 changes WHEN those two gates fire, not whether: `dev` -> `staging`
# runs once at `opened` and never again on a push into `dev`, and
# `staging` -> `main` runs when the draft is marked ready.  58% of this org's
# Actions minutes over the 14 days to 2026-08-26 went to re-running these two
# standing pull requests, and a red one re-ran forever.

on:
  # The two promotion branches.  A push to either is the moment a disparity can
  # appear, so this is the fast path.
  push:
    branches: [dev, staging]
    # ENG-3502 makes this trigger do double duty: it opens the elevation when
    # none exists, AND it is the only signal that new content landed on a
    # standing one.  `ELEVATION_PUSHED_REF` below carries which branch was
    # pushed, and the refresh happens only when that is the elevation's head —
    # so cron and `workflow_dispatch` cannot churn a pull request whose gate
    # has already seen its tip.

  schedule:
    # 14:40 UTC — early morning Pacific, so anything that accumulated overnight
    # is already open before anyone starts work.
    #
    # THE CRON IS NOT REDUNDANT with the push trigger, and it is the half that
    # survives.  A push run can be cancelled, hit a GitHub incident, or race a
    # token that had not been provisioned yet; a stalled promotion then stays
    # invisible until somebody happens to look.  The cron is the backstop that
    # makes "nothing is tracking dev" a state that lasts a day at most.
    #
    # Scheduled workflows only ever fire from the DEFAULT branch, which is `dev`
    # in every repository here (measured 2026-08-23).  So this is live the
    # moment it merges to `dev`, and it stays live regardless of what `staging`
    # or `main` carry.
    - cron: "40 14 * * *"

  workflow_dispatch:

# Declaring this block drops every permission not named.
# `pull-requests: write` is what `gh pr create` and the
# `POST .../pulls/{n}/requested_reviewers` that requests the production reviewer
# need; `contents: read` is for the checkout.  That second one was
# `gh pr edit --add-reviewer` until ENG-3987 — same permission, and REST because
# `gh pr edit` resolves the pull request through a GraphQL lookup that asks for
# `repository.pullRequest.projectCards`, a field GitHub has sunset and now
# errors on.  The permission was never the problem and does not change here.
permissions:
  contents: read
  pull-requests: write

jobs:
  # Runs once, gates both matrix legs.  Cheap — it builds a throwaway git
  # repository in a temp dir and stubs `gh`; no network, no toolchain.
  verify:
    name: Prove the decision table
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: bash scripts/auto-elevation-pr.test.sh

  elevate:
    name: ${{ matrix.head }} -> ${{ matrix.base }}
    needs: verify
    runs-on: ubuntu-latest
    strategy:
      # Both legs always run, and a failure on one must not hide the other.
      # They are independent promotions.
      fail-fast: false
      matrix:
        include:
          - head: dev
            base: staging
            # Nobody is requested on the staging hop, deliberately. A review
            # request on every one of these trains the reviewer to dismiss the
            # notification, and then the production one goes past unread.
            reviewer: ""
          - head: staging
            base: main
            reviewer: sperezl1
            # This leg is opened as a DRAFT (ENG-3437). The `--draft` decision
            # lives in `scripts/auto-elevation-pr.sh`, gated on this exact
            # head/base pair, and is asserted in both directions by
            # `scripts/auto-elevation-pr.test.sh` — which the `verify` job above
            # runs before this job may touch GitHub.

    # Two runs racing would both see "no open pull request" and both create one.
    # GitHub refuses the second (the script reads that refusal as already-done),
    # but a concurrency group is the cheaper protection. Per PAIR, so the two
    # legs never queue behind each other.
    #
    # `cancel-in-progress: true` (ENG-4183). This operation is idempotent and
    # last-write-wins by nature — it makes the elevation pull request reflect the
    # CURRENT head — so a superseded run's close/reopen is pure waste. Before
    # this, three pushes 12 seconds apart each performed their own close/reopen;
    # `reopened` is a `pull_request` activity type so it retriggers every gate
    # workflow, and closing cancels the in-flight ones. Two complete gate sets
    # were started and destroyed on one head sha (frontend #1799, 2026-09-03).
    # The self-hosted fleet's 2-7 minute queue used to coalesce rapid pushes and
    # was masking this; the workflow is GitHub-hosted now and runs in ~30s, so
    # nothing else collapses them.
    # Do NOT "restore" `false` on the reasoning that an elevation run must never
    # be cancelled: only a SUPERSEDED run is cancelled, and the run that replaces
    # it does the same idempotent work against a newer head.
    concurrency:
      group: auto-elevation-pr-${{ github.repository }}-${{ matrix.head }}-${{ matrix.base }}
      cancel-in-progress: true

    steps:
      # `fetch-depth: 0` is load-bearing. The default shallow checkout truncates
      # history at one commit, and `git rev-list --count base..head` over a
      # graft point does not report "shallow", it reports a WRONG NUMBER — which
      # would land in the pull request title. `filter: blob:none` keeps the full
      # commit graph without paying for file contents nobody reads here;
      # backend is 786 commits ahead of `main` today and none of them are
      # checked out for anything.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          filter: blob:none

      # ---- the credential, and why it is the whole design ------------------
      # A pull request opened with the default `GITHUB_TOKEN` runs NO
      # `pull_request` workflows. GitHub suppresses that so a workflow cannot
      # trigger itself forever. The consequence here is specific and bad: an
      # auto-opened elevation would show an EMPTY check list, which looks
      # identical at a glance to one whose suite passed — and `dev` -> `staging`
      # and `staging` -> `main` are the two gates ENG-3139 exists to protect.
      #
      # A GitHub App installation token is a different identity and is not
      # suppressed, so pull requests it opens run their checks normally.
      #
      # David's ruling, 2026-08-23: ship it now with a fallback, reusing the
      # existing package-sync App. Where the secrets are present the pull
      # request is opened by the App and its checks run; where they are absent
      # it is still opened, and its BODY says in plain language that the tests
      # did not start. Measured the same day, the secrets exist on `frontend`
      # and `mcp-server` only — so the fallback is the live path in five of the
      # seven repositories, and it is built to be read, not to be a footnote.
      #
      # NO CODE CHANGE IS NEEDED on the day the secrets appear. The three steps
      # below detect them, and the warning takes itself out of the body.
      - name: Are the App credentials here?
        id: creds
        env:
          # `secrets` is not available in a step-level `if:`, so its presence
          # has to become an output first.
          APP_ID: ${{ secrets.PACKAGE_SYNC_APP_ID }}
          PRIVATE_KEY: ${{ secrets.PACKAGE_SYNC_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          # Only presence is ever printed. The values are never echoed.
          if [ -n "${APP_ID:-}" ] && [ -n "${PRIVATE_KEY:-}" ]; then
            echo "have_app=true" >> "$GITHUB_OUTPUT"
            echo "Both package-sync secrets are present."
          else
            echo "have_app=false" >> "$GITHUB_OUTPUT"
            echo "::notice::No package-sync App credentials in this repository, so any pull request opened here will carry no checks and will say so in its body. See ENG-3180."
          fi

      # If this step dies with `error:1E08010C:DECODER routines::unsupported`,
      # the stored PEM's line breaks were lost. Re-save it FROM THE FILE rather
      # than by pasting: `gh secret set PACKAGE_SYNC_PRIVATE_KEY --repo
      # Rockhopper-Co/<repo> < <app>.private-key.pem`.
      - name: Mint an installation token
        id: app
        if: steps.creds.outputs.have_app == 'true'
        uses: actions/create-github-app-token@v3
        with:
          # `app-id` warns that `client-id` is preferred. The secret holds the
          # numeric App ID, not the `Iv23li…` client id, so this is the input
          # that matches the value actually stored. Warning only.
          app-id: ${{ secrets.PACKAGE_SYNC_APP_ID }}
          private-key: ${{ secrets.PACKAGE_SYNC_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}

      # MEASURE THE GRANT, DO NOT ASSERT IT. Holding the secrets is not the same
      # as the App being INSTALLED on this repository — `mcp-server` holds both
      # secrets today precisely so it can push into `mcp-gateway`, and the App's
      # own installation list is what decides whether the minted token can open
      # a pull request HERE.
      #
      # Without this step that mismatch surfaces as a 404 from `gh pr create`,
      # which reads like a missing branch. With it, the run falls back to
      # `GITHUB_TOKEN` and the body tells the reader the checks did not start —
      # the honest outcome rather than a confusing red.
      - name: Does that token actually reach this repository?
        id: reach
        if: steps.creds.outputs.have_app == 'true'
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
        run: |
          set -uo pipefail
          if gh api "repos/${GITHUB_REPOSITORY}" --jq .full_name > /dev/null 2>&1; then
            echo "reaches=true" >> "$GITHUB_OUTPUT"
            echo "The App token can see ${GITHUB_REPOSITORY} — checks will run."
          else
            echo "reaches=false" >> "$GITHUB_OUTPUT"
            echo "::warning::The package-sync App holds credentials here but is not installed on ${GITHUB_REPOSITORY}, so its token cannot open a pull request in this repository. Falling back to GITHUB_TOKEN, whose pull requests run no checks. Install the App here to fix it (ENG-3180)."
          fi

      - name: Open the elevation pull request, if one is needed
        env:
          # An empty `steps.app.outputs.token` is falsy, so a skipped mint or an
          # App that cannot reach this repository both land on `GITHUB_TOKEN`.
          GH_TOKEN: ${{ steps.reach.outputs.reaches == 'true' && steps.app.outputs.token || secrets.GITHUB_TOKEN }}
          # The single source of the body's warning. It is derived from what was
          # MEASURED above, never from what was configured.
          ELEVATION_CHECKS_RUN: ${{ steps.reach.outputs.reaches == 'true' }}
          # Through `env:`, never interpolated into the script body — a branch
          # name is text the templater must not be allowed to paste into a
          # shell. Same reasoning as mcp-gateway's `scripts/check-elevation.sh`.
          ELEVATION_HEAD: ${{ matrix.head }}
          ELEVATION_BASE: ${{ matrix.base }}
          ELEVATION_REVIEWER: ${{ matrix.reviewer }}
          # ENG-3502. Empty on `schedule` and `workflow_dispatch`, which is what
          # keeps the daily backstop from re-running the suite against content
          # the gate has already seen. `github.ref_name` on a push run is the
          # pushed branch; the script compares it to the head and refreshes only
          # on a match.
          ELEVATION_PUSHED_REF: ${{ github.event_name == 'push' && github.ref_name || '' }}
        run: bash scripts/auto-elevation-pr.sh
