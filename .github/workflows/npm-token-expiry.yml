name: npm token expiry watch

# The NPM_TOKEN on the `npm-publish` environment is the only credential that can
# promote a release to the `latest` dist-tag, and it expires. A human
# remembering is not a mechanism, so this is the mechanism.
#
# CI BUDGET: schedule + workflow_dispatch ONLY. A weekly cron is ~52 runs a
# year, one sub-minute job each. This deliberately has no `pull_request` or
# `push` trigger — those are banned outside prod elevations (David, 2026-07-31).
on:
  schedule:
    # Mondays 07:23 UTC (00:23 Pacific). Off the hour on purpose — GitHub
    # delays crons that land on popular round times.
    - cron: '23 7 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  check:
    name: Warn before the npm publish token expires
    runs-on: ubuntu-latest
    env:
      EXPIRY_FILE: .github/npm-token-expiry
      WARN_WITHIN_DAYS: '21'
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Read expiry and compute days remaining
        id: expiry
        run: |
          set -euo pipefail
          if [ ! -f "$EXPIRY_FILE" ]; then
            echo "::error::$EXPIRY_FILE is missing, so the token's expiry is unknown and this check cannot mean anything. Restore the file."
            exit 1
          fi
          EXPIRY=$(grep -v '^#' "$EXPIRY_FILE" | grep -v '^[[:space:]]*$' | head -1 | tr -d '[:space:]')
          if ! date -u -d "$EXPIRY" +%s >/dev/null 2>&1; then
            echo "::error::Could not parse '$EXPIRY' from $EXPIRY_FILE as a date. Expected YYYY-MM-DD."
            exit 1
          fi
          DAYS=$(( ( $(date -u -d "$EXPIRY" +%s) - $(date -u +%s) ) / 86400 ))
          # Always print the number. A run that did nothing must be
          # distinguishable from a run that never happened.
          LINE="NPM_TOKEN (npm-publish environment) expires $EXPIRY - $DAYS day(s) remaining. Warn threshold: $WARN_WITHIN_DAYS day(s)."
          echo "$LINE"
          echo "$LINE" >> "$GITHUB_STEP_SUMMARY"
          echo "expiry=$EXPIRY" >> "$GITHUB_OUTPUT"
          echo "days=$DAYS" >> "$GITHUB_OUTPUT"
          if [ "$DAYS" -le "$WARN_WITHIN_DAYS" ]; then
            echo "warn=true" >> "$GITHUB_OUTPUT"
          else
            echo "warn=false" >> "$GITHUB_OUTPUT"
            echo "Inside the safe window - no issue opened."
          fi

      - name: Open or update the rotation issue
        if: steps.expiry.outputs.warn == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          EXPIRY: ${{ steps.expiry.outputs.expiry }}
          DAYS: ${{ steps.expiry.outputs.days }}
        run: |
          set -euo pipefail
          TITLE="ROTATE NPM_TOKEN by $EXPIRY - npm releases stop when it expires"
          if [ "$DAYS" -lt 0 ]; then
            HEADLINE="**EXPIRED $(( -DAYS )) day(s) ago.** Promotion to the \`latest\` dist-tag is failing right now."
          else
            HEADLINE="**$DAYS day(s) left.** Rotate before $EXPIRY."
          fi
          { echo "$HEADLINE"; echo; cat .github/npm-token-expiry-issue.md; } > /tmp/issue-body.md
          EXISTING=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --limit 100 \
            --json number,title --jq "map(select(.title == \"$TITLE\")) | .[0].number // empty")
          if [ -n "$EXISTING" ]; then
            gh issue edit "$EXISTING" --repo "$GITHUB_REPOSITORY" --body-file /tmp/issue-body.md
            echo "Updated existing rotation issue #$EXISTING."
            echo "Updated existing rotation issue #$EXISTING." >> "$GITHUB_STEP_SUMMARY"
          else
            URL=$(gh issue create --repo "$GITHUB_REPOSITORY" --title "$TITLE" --body-file /tmp/issue-body.md)
            echo "Opened rotation issue $URL"
            echo "Opened rotation issue $URL" >> "$GITHUB_STEP_SUMMARY"
          fi
