name: Postman drift

on:
  # PROD ELEVATIONS ONLY — `main`-base pull requests. REVERTS ENG-2839 (plan 20
  # SP01), which had added `dev` here as a cheap drift check. David, 2026-08-22:
  # "that is incredibly expensive, and pointless, because i will purposefully
  # NEVER let them finish." A `dev`-base pull request is a formality he clears
  # immediately, so a check nobody waits on gates nothing.
  #
  # `workflow_dispatch` is what replaces it — it runs this check on demand
  # against any branch, which is why it stays.
  #
  # The `main` run asks "is what we ship intact?", and that question is
  # unchanged. NO `push` trigger, deliberately: a merge into a branch is a push
  # to it, so adding one would run the job twice for no new signal.
  #
  # Gated at the TRIGGER, not a job-level `if:` — a job-level condition still
  # creates the run and posts a skipped check.
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  generated-artifacts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run generate:postman:check
