name: Postman drift

on:
  # PROD ELEVATIONS ONLY (David, 2026-07-31): CI budget. Gated at the
  # trigger, not per-job — a job-level `if:` still creates the run and posts
  # skipped checks. Run validation locally; workflow_dispatch runs on demand.
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  generated-artifacts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run generate:postman:check
