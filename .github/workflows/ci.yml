name: CI

on:
  # PROD ELEVATIONS ONLY — `main`-base pull requests. REVERTS ENG-2857, which
  # had added `dev` here. David, 2026-08-22: "that is incredibly expensive, and
  # pointless, because i will purposefully NEVER let them finish." A `dev`-base
  # pull request is a formality he clears immediately, so a check nobody waits
  # on gates nothing and the run is wasted either way.
  #
  # `workflow_dispatch` is what replaces it — it runs this suite on demand
  # against any branch, which is why it stays.
  #
  # Still gated at the TRIGGER and not per-job: a job-level `if:` still creates
  # the run and posts skipped checks.
  #
  # ENG-2807 removed the `push: branches: [main]` trigger, and that stays
  # removed. It existed to run `auto-tag`, which cut `v<version>` and dispatched
  # publish.yml; publishing is now driven by the merge itself, and publish.yml
  # re-runs typecheck/test/build on that same push before it publishes anything.
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: Typecheck, test, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci
      - run: npm run typecheck
      # TODO(mcp): wire eslint (scope creep deferred from GA push); see issue tracker.
      # - run: npm run lint
      - run: npm test
      - run: npm run build

      # ENG-2810 — the `npm publish --dry-run` step that stood here is DELETED,
      # not authenticated. It ran unauthenticated, so npm packed the tarball
      # with no registry preflight: run 32297416574 packed `2.1.1` green while
      # `2.1.1` was already published, and the same command authenticated exits
      # 1 with "You cannot publish over the previously published versions".
      # It answered "does this tarball build" and was read as "will this
      # publish succeed" — a check that cannot fail for the reason it is
      # trusted to catch, spending the attention a real one would get.
      #
      # Authenticating it here would not have helped. Since ENG-2807 the
      # published version is DERIVED from `github.run_number` and package.json's
      # patch is decorative, so the version a dry-run packs on this runner is
      # never the version that publishes — a refusal here would be about a
      # version nobody ships. The registry question belongs where the derived
      # version exists: publish.yml's "Refuse a version the registry already
      # holds", which reds against the live registry and is attacked in
      # src/__tests__/unit/publish-workflow.test.ts.
