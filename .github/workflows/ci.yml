name: CI

on:
  # PROD ELEVATIONS ONLY (David, 2026-07-31): CI budget. Gated at the
  # trigger, not per-job — a job-level `if:` still creates the run and posts
  # skipped checks. Run validation locally; workflow_dispatch runs on demand.
  pull_request:
    branches: [main]
  push:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  actions: write

jobs:
  verify:
    name: Typecheck, test, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci
      - run: npm run typecheck
      # TODO(mcp): wire eslint (scope creep deferred from GA push); see issue tracker.
      # - run: npm run lint
      - run: npm test
      - run: npm run build

      - name: Dry-run npm publish (no auth required)
        run: npm publish --dry-run --access public

  auto-tag:
    name: Tag release if version bumped
    needs: verify
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Check for new version and create tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          PKG_VERSION=$(node -p "require('./package.json').version")
          TAG="v${PKG_VERSION}"
          if git rev-parse "$TAG" >/dev/null 2>&1; then
            # ENG-2748: the tag can pre-exist when the version was published to
            # the `staging` dist-tag first (or hand-tagged). Existence of the
            # tag is not the same as `latest` pointing at it — check the
            # registry and dispatch the promotion if `latest` lags.
            LATEST=$(npm view "$(node -p "require('./package.json').name")" dist-tags.latest 2>/dev/null || true)
            if [ "$LATEST" = "$PKG_VERSION" ]; then
              echo "Tag $TAG exists and latest=$LATEST — nothing to do."
            else
              echo "Tag $TAG exists but latest=${LATEST:-<unset>} — dispatching publish to promote."
              gh workflow run publish.yml --ref "$TAG"
            fi
          else
            echo "Creating tag $TAG"
            git tag "$TAG"
            git push origin "$TAG"
            # --ref is REQUIRED. Without it `gh workflow run` targets the repo
            # DEFAULT branch (dev), not the tag: the 0.9.0 attempt ran against
            # dev, which silently skips publish.yml's "Verify package version
            # matches tag" guard (it is gated on refs/tags/v*) and would publish
            # whatever dev happened to hold. The explicit dispatch exists because
            # a GITHUB_TOKEN-pushed tag does not fire `on: push: tags` at all.
            echo "Dispatching publish workflow for $TAG"
            gh workflow run publish.yml --ref "$TAG"
          fi
