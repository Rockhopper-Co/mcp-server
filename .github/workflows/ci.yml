name: CI

on:
  # PROD ELEVATIONS ONLY (David, 2026-07-31): CI budget. Gated at the
  # trigger, not per-job — a job-level `if:` still creates the run and posts
  # skipped checks. Run validation locally; workflow_dispatch runs on demand.
  #
  # ENG-2807 removed the `push: branches: [main]` trigger. It existed to run
  # `auto-tag`, which cut `v<version>` and dispatched publish.yml; publishing is
  # now driven by the merge itself, and publish.yml re-runs typecheck/test/build
  # on that same push before it publishes anything. Keeping both would have paid
  # for the identical gate twice on every elevation.
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: Typecheck, test, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci
      - run: npm run typecheck
      # TODO(mcp): wire eslint (scope creep deferred from GA push); see issue tracker.
      # - run: npm run lint
      - run: npm test
      - run: npm run build

      - name: Dry-run npm publish (no auth required)
        run: npm publish --dry-run --access public
