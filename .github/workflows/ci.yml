name: CI

on:
  # ENG-3139 — this suite runs where a pull request SITS AND SOMEONE WAITS, and
  # never where it is merged on sight. David approved this topology 2026-08-23.
  # It supersedes the 2026-08-22 "PROD ELEVATIONS ONLY" revert whose comment
  # stood here, and the 2026-07-31 CI-budget rule behind that.
  #
  # Measured per 60 merged pull requests: `feature -> dev` (21-37) and
  # `feature -> epic/**` (18-33) are merged on sight with nobody waiting, so
  # they are NOT gated. `epic/** -> dev` (~1 per epic, open for days),
  # `dev -> staging` (6-25, and manual QA follows it) and `staging -> main`
  # (1-3) all sit open with someone waiting, so all three ARE gated. The
  # staging gate is the one this round existed to add: what sits behind it is
  # manual QA time.
  #
  # The trigger names all three bases; the job-level `if:` below sorts out the
  # `dev` one — a dev-base pull request runs only when its head is an `epic/**`
  # branch. Every other dev-base pull request posts a SKIPPED check and spends
  # zero runner minutes. David accepted that visible skip in place of a manual
  # dispatch; a job-level `if:` still CREATES the run and nothing avoids that.
  #
  # `workflow_dispatch` stays and is load-bearing: it runs typecheck, test and build on demand
  # against any branch, including a feature branch no gate sees.
  #
  # NO `push` TRIGGER, AND THAT IS UNCHANGED BY THIS ROUND. ENG-2807 removed
  # `push: branches: [main]`, which existed to run `auto-tag` (it cut
  # `v<version>` and dispatched publish.yml). Publishing is now driven by the
  # merge itself, and publish.yml re-runs typecheck/test/build on that same push
  # before it publishes anything — so a push trigger here would duplicate a run
  # publish.yml already does. That reasoning survives the widening: ENG-3139
  # adds pull-request bases, never a push.
  pull_request:
    branches: [dev, staging, main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    # ENG-3139 — a dev-base pull request runs only when its head is an epic
    # branch; `feature -> dev` is merged on sight and nobody waits on it.
    # `staging` and `main` bases always run. See the trigger header.
    if: github.base_ref != 'dev' || startsWith(github.head_ref, 'epic/')
    name: Typecheck, test, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci
      - run: npm run typecheck
      # TODO(mcp): wire eslint (scope creep deferred from GA push); see issue tracker.
      # - run: npm run lint
      - run: npm test
      - run: npm run build

      # ENG-2810 — the `npm publish --dry-run` step that stood here is DELETED,
      # not authenticated. It ran unauthenticated, so npm packed the tarball
      # with no registry preflight: run 32297416574 packed `2.1.1` green while
      # `2.1.1` was already published, and the same command authenticated exits
      # 1 with "You cannot publish over the previously published versions".
      # It answered "does this tarball build" and was read as "will this
      # publish succeed" — a check that cannot fail for the reason it is
      # trusted to catch, spending the attention a real one would get.
      #
      # Authenticating it here would not have helped. Since ENG-2807 the
      # published version is DERIVED from `github.run_number` and package.json's
      # patch is decorative, so the version a dry-run packs on this runner is
      # never the version that publishes — a refusal here would be about a
      # version nobody ships. The registry question belongs where the derived
      # version exists: publish.yml's "Refuse a version the registry already
      # holds", which reds against the live registry and is attacked in
      # src/__tests__/unit/publish-workflow.test.ts.
